name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test & package debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (with dependency & build cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit & UI smoke tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APKs
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload customer app APK
        uses: actions/upload-artifact@v4
        with:
          name: madak-spices-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload admin app APK
        uses: actions/upload-artifact@v4
        with:
          name: madak-admin-debug-apk
          path: admin/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/outputs/screenshots/
          if-no-files-found: ignore

  release:
    name: Signed release APKs (only when signing secrets exist)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Skip notice
        if: env.HAS_KEYSTORE != 'true'
        run: echo "Signing secrets are not configured - skipping the release build. Debug APKs are still produced by the build job."

      - uses: actions/checkout@v4
        if: env.HAS_KEYSTORE == 'true'

      - uses: actions/setup-java@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        if: env.HAS_KEYSTORE == 'true'

      - uses: gradle/actions/setup-gradle@v4
        if: env.HAS_KEYSTORE == 'true'

      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/madak-release.jks"
          echo "MADAK_KEYSTORE_PATH=$RUNNER_TEMP/madak-release.jks" >> "$GITHUB_ENV"

      - name: Assemble signed release APKs
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Remove decoded keystore
        if: always() && env.HAS_KEYSTORE == 'true'
        run: rm -f "$RUNNER_TEMP/madak-release.jks"

      - name: Upload release APKs
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: madak-release-apks
          path: |
            app/build/outputs/apk/release/*.apk
            admin/build/outputs/apk/release/*.apk
          if-no-files-found: error
